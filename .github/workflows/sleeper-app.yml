# GitHub Actions workflow: automatically re-renders and pushes both
# sleeper_fantasy.star and nfl_scores.star to your Tidbyt on a schedule, so
# the device stays fresh without your computer needing to be on.
#
# SETUP (one-time):
#   1. Create a new GitHub repo (can be private) and push BOTH
#      sleeper_fantasy.star and nfl_scores.star to its root.
#   2. Save this file as: .github/workflows/update-tidbyt.yml
#   3. In the repo: Settings -> Secrets and variables -> Actions -> New repository secret
#        - Add TIDBYT_API_TOKEN  (your Tidbyt API token)
#        - Add TIDBYT_DEVICE_ID  (your Tidbyt device ID)
#   4. Commit + push. The workflow will start running automatically on the
#      schedule below, and you can also trigger it manually from the
#      "Actions" tab in GitHub ("Run workflow" button).
#
# NOTE: GitHub's schedule triggers are "best effort" and won't reliably run
# more often than every 5 minutes, even if the cron expression asks for
# every minute — during busy periods a run can also be delayed further.
# For live game-day scores expect occasional lag, not to-the-second accuracy.

name: Update Tidbyt Apps

on:
  schedule:
    - cron: "*/5 * * * *"  # every 5 minutes (GitHub's realistic minimum interval)
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab

jobs:
  render-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Install pixlet
        run: |
          set -euo pipefail
          URL=$(curl -s https://api.github.com/repos/tidbyt/pixlet/releases/latest \
            | grep "browser_download_url.*linux.*amd64" \
            | cut -d '"' -f 4 \
            | head -n 1)
          echo "Downloading $URL"
          curl -sL "$URL" -o pixlet.tar.gz
          tar -xzf pixlet.tar.gz
          chmod +x pixlet
          sudo mv pixlet /usr/local/bin/pixlet
          pixlet version

      - name: Render Sleeper Fantasy app
        run: pixlet render sleeper_fantasy.star

      - name: Push Sleeper Fantasy to Tidbyt
        run: |
          pixlet push \
            --api-token "${{ secrets.TIDBYT_API_TOKEN }}" \
            "${{ secrets.TIDBYT_DEVICE_ID }}" \
            sleeper_fantasy.webp \
            --installation-id sleeperfantasy

